<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- ビューポート設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松本一樹 -itsuki matsumoto- : contact</title>
  <link rel="stylesheet" href="../assets/css/1212-music.tokens.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=20261118-44">
</head>
<body class="site-contact">
  <!-- ヘッダー -->
  <header class="site-header">
    <div class="container header-container">
      <h1 class="logo">
        松本一樹
        <span class="pc-only"> -<span class="accent">i</span>tsuki matsumoto-</span>
        <span class="sp-only"> -<span class="accent">i</span>tsuki matsumoto-</span>
      </h1>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="global-nav" aria-label="メニューを開閉">
        <span class="nav-toggle-text">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <nav id="global-nav">
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../live/">Live</a></li>
          <li><a href="../music/">Music</a></li>
          <li><a href="../profile/">Profile</a></li>
          <li><a href="../contact/">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <main id="contact-content" class="contact-container">
    <h1 class="site-section-title">contact</h1>
    <div id="contact-panel" class="contact-panel">
      <p id="contact-intro" class="contact-intro">お問い合わせは以下のフォームに必要事項をご入力の上、送信してください。</p>
      <form id="contact-form" class="contact-form" action="https://formspree.io/f/xqaeddgj" method="POST" novalidate>
        <div class="contact-field">
          <label for="name">名前</label>
          <input type="text" id="name" name="name" placeholder="例: 松本 一樹" required>
          <p class="contact-error" id="name-error" hidden></p>
        </div>
        <div class="contact-field">
          <label for="email">e-mail</label>
          <input type="email" id="email" name="_replyto" placeholder="例: example@mail.com" required>
          <p class="contact-error" id="email-error" hidden></p>
        </div>
        <div class="contact-field">
          <label for="message">内容</label>
          <textarea id="message" name="message" rows="5" placeholder="お問い合わせ内容をご記入ください" required></textarea>
          <p class="contact-error" id="message-error" hidden></p>
        </div>
        <div id="contact-failure" class="contact-failure" role="alert" hidden>送信できませんでした。入力内容は残っています。時間をおいて、もう一度お試しください。</div>
        <button id="contact-submit" type="submit" class="site-button site-button--primary">送信する</button>
      </form>
      <div id="contact-done" class="contact-done" tabindex="-1" hidden></div>
    </div>
    <p id="contact-status" class="contact-sr" role="status"></p>
  </main>
  
  <footer class="site-footer">
    <div class="container">
      <p id="site-footer">&copy; 2025 松本一樹 -itsuki matsumoto-. All rights reserved.</p>
    </div>
  </footer>
  
  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/site-content.js?v=20261118-44"></script>
  <script src="../assets/js/contact.js?v=20261119-45"></script>
  <script src="../assets/js/script.js?v=20261118-44"></script>
</body>
</html>
