<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松本一樹 -itsuki matsumoto- : ticket</title>
  <link rel="stylesheet" href="../assets/css/1212-music.tokens.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=20261118-44">
  <link rel="stylesheet" href="../assets/css/live-ticket.css?v=20261119-43">
</head>
<body class="site-ticket">
  <header class="site-header">
    <div class="container header-container">
      <h1 class="logo">
        松本一樹
        <span class="pc-only"> -<span class="accent">i</span>tsuki matsumoto-</span>
        <span class="sp-only"> -<span class="accent">i</span>tsuki matsumoto-</span>
      </h1>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="global-nav" aria-label="メニューを開閉">
        <span class="nav-toggle-text">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <nav id="global-nav">
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../live/">Live</a></li>
          <li><a href="../music/">Music</a></li>
          <li><a href="../profile/">Profile</a></li>
          <li><a href="../contact/">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="ticket-content" class="live-container ticket-container" data-site-root="../" data-state="loading" aria-busy="true">
    <a id="ticket-back" class="live-back" href="../live/">← live</a>
    <h1 class="site-section-title" tabindex="-1" data-live-focus>ticket</h1>
    <div id="ticket-loading"><div class="live-skeleton" role="status">読み込み中</div></div>
    <div id="ticket-notice" class="live-notice" role="status" aria-live="polite" hidden></div>
    <div id="ticket-layout" class="ticket-layout" hidden>
      <form id="ticket-form" class="ticket-form" novalidate>
        <div id="ticket-field-live" class="ticket-field">
          <label id="ticket-label-live" for="liveId">ライブ</label>
          <select id="liveId" name="liveId" required></select>
        </div>
        <div id="ticket-fields" class="ticket-fields">
          <div id="ticket-field-name" class="ticket-field">
            <label id="ticket-label-name" for="name">名前</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <p id="ticket-error-name" class="ticket-error" role="alert" hidden></p>
          </div>
          <div id="ticket-field-email" class="ticket-field">
            <label id="ticket-label-email" for="email">e-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <p id="ticket-error-email" class="ticket-error" role="alert" hidden></p>
          </div>
          <div id="ticket-field-quantity" class="ticket-field ticket-field--quantity">
            <label id="ticket-label-quantity" for="quantity">枚数</label>
            <input id="quantity" name="quantity" type="number" min="1" max="10" value="1" required>
            <p id="ticket-error-quantity" class="ticket-error" role="alert" hidden></p>
          </div>
          <div id="ticket-field-message" class="ticket-field">
            <label id="ticket-label-message" for="message">備考</label>
            <textarea id="message" name="message" rows="4" placeholder="例: 取り置き名義が別の場合など"></textarea>
          </div>
          <input type="text" name="company" id="company" class="ticket-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="ticket-actions">
            <button type="submit" id="submitBtn" class="site-button site-button--primary">予約する</button>
          </div>
        </div>
        <p id="ticket-status" class="ticket-status" role="status" aria-live="polite"></p>
      </form>
      <aside id="ticket-live-preview" class="ticket-summary" aria-labelledby="ticket-summary-label" hidden>
        <p id="ticket-summary-label" class="ticket-summary-label">予約するライブ</p>
        <div id="ticket-summary-body"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="site-footer">&copy; 2025 松本一樹 -itsuki matsumoto-. All rights reserved.</p>
    </div>
  </footer>

  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/live-operations.js?v=20260804-2"></script>
  <script src="../assets/js/live-order.js?v=20261119-43"></script>
  <script src="../assets/js/reservation-cta.js?v=20261119-43"></script>
  <script src="../assets/js/ticket-receipt.js?v=20261119-43"></script>
  <script src="../assets/js/ticket.js?v=20261119-43"></script>
  <script src="../assets/js/script.js?v=20261118-44"></script>
</body>
</html>
